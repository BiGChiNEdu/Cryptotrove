[package]
name = "legacy-vault"
version = "0.1.0"
edition = "2021"
description = "CryptoTrove Legacy Vault: dead-man's-switch with a 12-month check-in and a 90-day grace period"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.5.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
